<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chengdu Ledger</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg id="icon-sprite" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="icon-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12l-7-2-4-7-1.5.5L10 11l-6 1-2-2-1.3.5L2 13.5 4.5 15l3.5 5 1.3-.4L8 15l6-1 5.5 4.5.5-1.5-7-4 7-1z"/>
  </symbol>
  <symbol id="icon-bed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 18v-7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1"/>
    <path d="M13 12h6a2 2 0 0 1 2 2v4"/>
    <path d="M3 15h18v3"/>
    <path d="M6 9V6"/>
    <circle cx="6.5" cy="12" r="1.2" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="icon-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/>
    <circle cx="12" cy="9" r="2.4"/>
  </symbol>
  <symbol id="icon-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 16V11l2-5h12l2 5v5"/>
    <path d="M4 16h16"/>
    <circle cx="7.5" cy="16.5" r="1.5"/>
    <circle cx="16.5" cy="16.5" r="1.5"/>
    <path d="M6 11h12"/>
  </symbol>
  <symbol id="icon-bowl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11h18a9 6 0 0 1-18 0z"/>
    <path d="M6 11a6 4 0 0 1 12 0"/>
    <path d="M10 5.5V3M14 5.5V3.5"/>
  </symbol>
  <symbol id="icon-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.3 2.4a7.5 7.5 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 1.7 1L9 21h4l.3-2.4a7.5 7.5 0 0 0 1.7-1l2.4 1 2-3.4z"/>
  </symbol>
  <symbol id="icon-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/>
  </symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="icon-tray" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h5l1.5 3h5L16 12h5"/>
    <path d="M5 12l1.5-6h11L19 12"/>
    <path d="M3 12v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6"/>
  </symbol>
</svg>

<div class="page">

  <div class="sync-banner" id="syncBanner"></div>

  <div style="position:relative">
    <button class="gear-btn" id="gearBtn" title="Trip settings" aria-label="Trip settings">
      <svg><use href="#icon-gear"/></svg>
    </button>
    <div class="masthead" id="masthead"></div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="field"><label for="setName">Trip name</label><input id="setName" type="text" maxlength="40"></div>
    <div class="field"><label for="setSub">Dates</label><input id="setSub" type="text" maxlength="30" placeholder="e.g. 10&ndash;17 April 2027"></div>
    <div class="field field-full"><label for="setRoute">Route</label><input id="setRoute" type="text" maxlength="30" placeholder="SIN &rarr; TFU"></div>
    <div class="actions">
      <button class="btn" id="settingsCancel">Close</button>
      <button class="btn btn-primary" id="settingsSave">Save</button>
    </div>
  </div>

  <div class="spend-split" id="spendSplit"></div>

  <div class="summary-row" id="summaryRow"></div>

  <div class="settle-card" id="settleCard"></div>

  <div class="converter">
    <div class="card-title"><svg><use href="#icon-swap"/></svg>Quick convert</div>
    <div class="convert-row">
      <div class="convert-field">
        <label>SINGAPORE DOLLARS</label>
        <div class="input-wrap"><span class="num">S$</span><input class="num" id="convSGD" type="number" inputmode="decimal" placeholder="0.00"></div>
      </div>
      <svg class="swap-icon"><use href="#icon-swap"/></svg>
      <div class="convert-field">
        <label>CHINESE YUAN</label>
        <div class="input-wrap"><span class="num">&yen;</span><input class="num" id="convCNY" type="number" inputmode="decimal" placeholder="0.00"></div>
      </div>
    </div>
    <div class="rate-line">
      1 SGD = <input class="num" id="rateInput" type="number" step="0.0001" inputmode="decimal"> CNY
      <span id="rateNote">&middot; edit anytime &mdash; rates move day to day</span>
    </div>
  </div>

  <div class="ledger-card">
    <div class="ledger-head">
      <div class="card-title"><svg><use href="#icon-tray"/></svg>Trip ledger</div>
    </div>
    <div class="tabs" id="tabs"></div>

    <div class="whoami-bar" id="whoamiBar"></div>

    <form class="entry-form" id="entryForm">
      <div class="field cat">
        <label for="fCategory">Category</label>
        <select id="fCategory" required></select>
      </div>
      <div class="field desc">
        <label for="fDesc">Description</label>
        <input id="fDesc" type="text" placeholder="e.g. Sichuan Airlines SIN&ndash;TFU" required maxlength="80">
      </div>
      <div class="field amt">
        <label for="fAmount">Amount</label>
        <input id="fAmount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" required>
      </div>
      <div class="field cur">
        <label for="fCurrency">Currency</label>
        <select id="fCurrency">
          <option value="SGD">SGD</option>
          <option value="CNY">CNY</option>
        </select>
      </div>
      <div class="field paid">
        <label for="fPaidBy">Paid by</label>
        <select id="fPaidBy" required>
          <option value="andik-mirta">Andik &amp; Mirta</option>
          <option value="aljufrey-siti">Aljufrey &amp; Siti</option>
        </select>
      </div>
      <div class="field date">
        <label for="fDate">Date</label>
        <input id="fDate" type="date">
      </div>
      <div class="field ref">
        <label for="fRef">Booking ref / notes</label>
        <input id="fRef" type="text" placeholder="e.g. PNR JQ4821" maxlength="60">
      </div>
      <div class="split-status split-field">
        <label style="font-size:12px;color:var(--muted);font-weight:600;">Split</label>
        <div class="split-mode-toggle" id="splitModeToggle">
          <button type="button" class="chip-toggle active" data-splitmode="even">Even</button>
          <button type="button" class="chip-toggle" data-splitmode="custom">Custom amounts</button>
        </div>
        <div class="split-check" id="splitEvenControls">
          <label><input type="checkbox" id="splitAM" checked> Andik &amp; Mirta</label>
          <label><input type="checkbox" id="splitAS" checked> Aljufrey &amp; Siti</label>
        </div>
        <div class="split-custom" id="splitCustomControls" hidden>
          <div class="custom-share-row"><label for="customAM">Andik &amp; Mirta owes</label><input type="number" id="customAM" step="0.01" min="0" placeholder="0.00"></div>
          <div class="custom-share-row"><label for="customAS">Aljufrey &amp; Siti owes</label><input type="number" id="customAS" step="0.01" min="0" placeholder="0.00"></div>
          <div class="custom-remainder" id="customRemainder"></div>
        </div>
      </div>
      <div class="split-status status-field">
        <label style="font-size:12px;color:var(--muted);font-weight:600;">Status</label>
        <div class="status-toggle">
          <button type="button" class="chip-toggle active" data-status="confirmed">Confirmed</button>
          <button type="button" class="chip-toggle" data-status="estimate">Estimate</button>
        </div>
      </div>
      <div class="submit-row">
        <span class="form-note" id="formNote">Everyone with this site's link can add and see entries.</span>
        <button type="submit" class="btn btn-primary"><svg style="width:13px;height:13px;vertical-align:-2px;margin-right:5px"><use href="#icon-plus"/></svg>Log entry</button>
      </div>
    </form>

    <div class="entries" id="entries"></div>
  </div>

  <div class="breakdown" id="breakdown">
    <div class="card-title">Spend by category</div>
    <div id="breakdownRows"></div>
  </div>

  <footer class="pagefoot">Chengdu &middot; 8&ndash;15 April 2027 &mdash; shared by Andik &amp; Mirta and Aljufrey &amp; Siti</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
